name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Keeps the release PR (version, CHANGELOG.md) up to date with the Conventional Commits on main. Merging that PR
  # makes it tag and create the GitHub release; the release job below then attaches the binaries. This lives in the
  # same workflow because tags and releases created with GITHUB_TOKEN do not trigger other workflows.
  release-please:
    name: Release PR
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: LinuxX64
            binDir: linuxX64
            exe: jetbrains-markdown-cli.kexe
            smoke: true
          # Kotlin/Native cannot run on arm64 Linux hosts, so this is cross-compiled
          # and smoke-tested in the separate test-linux-arm64 job.
          - name: linux-arm64
            os: ubuntu-latest
            target: LinuxArm64
            binDir: linuxArm64
            exe: jetbrains-markdown-cli.kexe
            smoke: false
          - name: windows-amd64
            os: windows-latest
            target: MingwX64
            binDir: mingwX64
            exe: jetbrains-markdown-cli.exe
            smoke: true
          - name: macos-arm64
            os: macos-latest
            target: MacosArm64
            binDir: macosArm64
            exe: jetbrains-markdown-cli.kexe
            smoke: true
          # Cross-compiled on the arm64 runner, so no smoke test.
          - name: macos-amd64
            os: macos-latest
            target: MacosX64
            binDir: macosX64
            exe: jetbrains-markdown-cli.kexe
            smoke: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts') }}

      - name: Test
        if: matrix.smoke
        run: ./gradlew ${{ matrix.binDir }}Test

      - name: Link release executable
        run: ./gradlew linkReleaseExecutable${{ matrix.target }}

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          [[ "$(build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --version)" =~ ^jetbrains-markdown-cli\ [0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$ ]]
          out=$(printf '# Hello\n\nsome *markdown*\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }})
          echo "$out"
          [[ "$out" == *"<h1 id=\"hello\">Hello</h1>"* && "$out" == *"<em>markdown</em>"* ]]
          out=$(printf '# Hello\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone)
          [[ "$out" == "<!DOCTYPE html>"* && "$out" == *"<title>Hello</title>"* ]]
          out=$(printf -- '---\ntitle: Mine\n---\n\n# Hello\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone)
          [[ "$out" == *"<title>Mine</title>"* && "$out" != *"<hr"* ]]
          out=$(printf '# Hello\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone -V title=Variable)
          [[ "$out" == *"<title>Variable</title>"* ]]
          out=$(printf '# Hello\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone -V title=T -V abstract=Abs)
          [[ "$out" == *'<div class="abstract-title">Abstract</div>'* && "$out" == *'<p>Abs</p>'* ]]
          out=$(printf '# One\n## Two\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone --toc)
          [[ "$out" == *'<nav id="TOC" role="doc-toc">'* && "$out" == *'<a href="#two" id="toc-two">Two</a>'* ]]
          out=$(printf '# Hello\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone)
          [[ "$out" == *"<style>"* ]]
          out=$(printf '# Hello\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone -V css=my.css)
          [[ "$out" == *'break-inside: avoid;'* && "$out" == *'<link rel="stylesheet" href="my.css">'* && "$out" != *'max-width: 980px'* ]]
          out=$(printf '# Hello\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone -V css=none -V css=my.css)
          [[ "$out" != *"<style>"* && "$out" == *'<link rel="stylesheet" href="my.css">'* ]]
          out=$(printf '# Hello\n\n```kotlin\nval x = 1\n```\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone -V highlight)
          [[ "$out" == *'<code class="language-kotlin">'* && "$out" == *'cdn-assets/highlight.min.js" defer></script>'* && "$out" == *'styles/idea.min.css'* ]]
          out=$(printf '# Hello\n\n```mermaid\ngraph TD\n  A --> B\n```\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone -V mermaid)
          [[ "$out" == *'<code class="language-mermaid">'* && "$out" == *'mermaid/dist/mermaid.min.js" defer></script>'* ]]
          out=$(printf '# Hello\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --standalone)
          [[ "$out" != *"highlight.min.js"* && "$out" != *"mermaid.min.js"* ]]
          out=$(printf 'a <b>x</b>\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} --no-raw-html)
          [[ "$out" == *'<p>a &lt;b&gt;x&lt;/b&gt;</p>'* ]]
          printf '# One\n' > one.md
          printf 'two\n' | build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} one.md - -o out.html
          [[ "$(cat out.html)" == *"<h1 id=\"one\">One</h1>"* && "$(cat out.html)" == *"<p>two</p>"* ]]

      - name: Package
        shell: bash
        run: |
          name=jetbrains-markdown-cli-${{ matrix.name }}
          mkdir -p dist/$name
          cp LICENSE THIRD-PARTY dist/$name/
          if [[ "${{ matrix.name }}" == windows-* ]]; then
            cp build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} dist/$name/jetbrains-markdown-cli.exe
            (cd dist && 7z a $name.zip $name > /dev/null)
          else
            cp build/bin/${{ matrix.binDir }}/releaseExecutable/${{ matrix.exe }} dist/$name/jetbrains-markdown-cli
            chmod +x dist/$name/jetbrains-markdown-cli
            tar -C dist -czf dist/$name.tar.gz $name
          fi
          rm -rf dist/$name

      - uses: actions/upload-artifact@v7
        with:
          name: jetbrains-markdown-cli-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  test-linux-arm64:
    name: test linux-arm64 binary
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jetbrains-markdown-cli-linux-arm64

      - name: Smoke test
        run: |
          tar -xzf jetbrains-markdown-cli-linux-arm64.tar.gz
          test -s jetbrains-markdown-cli-linux-arm64/LICENSE && test -s jetbrains-markdown-cli-linux-arm64/THIRD-PARTY
          [[ "$(jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --version)" =~ ^jetbrains-markdown-cli\ [0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$ ]]
          out=$(printf '# Hello\n\nsome *markdown*\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli)
          echo "$out"
          [[ "$out" == *"<h1 id=\"hello\">Hello</h1>"* && "$out" == *"<em>markdown</em>"* ]]
          out=$(printf '# Hello\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone)
          [[ "$out" == "<!DOCTYPE html>"* && "$out" == *"<title>Hello</title>"* ]]
          out=$(printf -- '---\ntitle: Mine\n---\n\n# Hello\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone)
          [[ "$out" == *"<title>Mine</title>"* && "$out" != *"<hr"* ]]
          out=$(printf '# Hello\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone -V title=Variable)
          [[ "$out" == *"<title>Variable</title>"* ]]
          out=$(printf '# Hello\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone -V title=T -V abstract=Abs)
          [[ "$out" == *'<div class="abstract-title">Abstract</div>'* && "$out" == *'<p>Abs</p>'* ]]
          out=$(printf '# One\n## Two\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone --toc)
          [[ "$out" == *'<nav id="TOC" role="doc-toc">'* && "$out" == *'<a href="#two" id="toc-two">Two</a>'* ]]
          out=$(printf '# Hello\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone)
          [[ "$out" == *"<style>"* ]]
          out=$(printf '# Hello\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone -V css=my.css)
          [[ "$out" == *'break-inside: avoid;'* && "$out" == *'<link rel="stylesheet" href="my.css">'* && "$out" != *'max-width: 980px'* ]]
          out=$(printf '# Hello\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone -V css=none -V css=my.css)
          [[ "$out" != *"<style>"* && "$out" == *'<link rel="stylesheet" href="my.css">'* ]]
          out=$(printf '# Hello\n\n```kotlin\nval x = 1\n```\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone -V highlight)
          [[ "$out" == *'<code class="language-kotlin">'* && "$out" == *'cdn-assets/highlight.min.js" defer></script>'* && "$out" == *'styles/idea.min.css'* ]]
          out=$(printf '# Hello\n\n```mermaid\ngraph TD\n  A --> B\n```\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone -V mermaid)
          [[ "$out" == *'<code class="language-mermaid">'* && "$out" == *'mermaid/dist/mermaid.min.js" defer></script>'* ]]
          out=$(printf '# Hello\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --standalone)
          [[ "$out" != *"highlight.min.js"* && "$out" != *"mermaid.min.js"* ]]
          out=$(printf 'a <b>x</b>\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli --no-raw-html)
          [[ "$out" == *'<p>a &lt;b&gt;x&lt;/b&gt;</p>'* ]]
          printf '# One\n' > one.md
          printf 'two\n' | jetbrains-markdown-cli-linux-arm64/jetbrains-markdown-cli one.md - -o out.html
          [[ "$(cat out.html)" == *"<h1 id=\"one\">One</h1>"* && "$(cat out.html)" == *"<p>two</p>"* ]]

  # The action (action.yml) downloads the binaries of the latest release, so this runs it against what is released,
  # not against the commit under test, on every platform it supports.
  # Tests the action against the latest release. In a run that has just made a release that is the new one, which has
  # no binaries until the release job has attached them, so such a run does not test it (the run before did).
  test-action:
    name: test action (${{ matrix.os }})
    if: ${{ !cancelled() && needs.release-please.outputs.release_created != 'true' }}
    needs: release-please
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Write some Markdown
        shell: bash
        run: |
          printf '# Hello\n\nsome *markdown*\n' > one.md
          printf '## Two\n' > two.md

      - uses: ./
        id: convert
        with:
          input-files: |
            one.md
            two.md
          output-file: out/out.html
          toc: true
          variables: |
            title=From the action
            css=github

      - name: Check the output
        shell: bash
        env:
          OUTPUT_FILE: ${{ steps.convert.outputs.output-file }}
          VERSION: ${{ steps.convert.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]
          [[ "$OUTPUT_FILE" == out/out.html ]]
          out=$(cat "$OUTPUT_FILE")
          [[ "$out" == "<!DOCTYPE html>"* && "$out" == *"<title>From the action</title>"* ]]
          [[ "$out" == *'<h1 id="hello">Hello</h1>'* && "$out" == *'<a href="#two" id="toc-two">Two</a>'* ]]
          # The binary stays on the PATH for later steps.
          [[ "$(jetbrains-markdown-cli --version)" == "jetbrains-markdown-cli $VERSION"* ]]

      - name: Write a defaults file
        shell: bash
        run: |
          printf 'input-files: [one.md]\noutput-file: from-defaults.html\nstandalone: false\n' > defaults.yaml

      - uses: ./
        with:
          defaults: defaults

      - name: Check the output of the defaults file
        shell: bash
        run: '[[ "$(cat from-defaults.html)" == *"<em>markdown</em>"* ]]'

  # Merges the release PR once everything on main is green, so every feat/fix is released without a manual step.
  # The merge is a push made with GITHUB_TOKEN, which does not start a workflow run (workflow_dispatch is the one
  # event it can start), so this workflow is dispatched again: that run finds the merged PR, makes the release,
  # and the release job attaches the binaries.
  merge-release:
    name: Merge release PR
    if: github.event_name == 'push' && needs.release-please.outputs.release_created != 'true'
    needs: [release-please, build, test-linux-arm64, test-action, test-image]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Merge the release PR and run this workflow again to release it
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --label 'autorelease: pending' --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No release PR is open."
            exit 0
          fi
          # A newer push has its own run, which updates the PR again and merges it if that run is green.
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" != "$GITHUB_SHA" ]; then
            echo "main has moved on since this run started; leaving release PR #$pr to the run of the newer commit."
            exit 0
          fi
          gh pr merge "$pr" --squash --repo "$GITHUB_REPOSITORY"
          gh workflow run build.yml --ref main --repo "$GITHUB_REPOSITORY"

  # The container image (Containerfile) is built from the linux binaries that were just built, with Docker (BuildKit) and
  # with podman and buildah, which the runner has as well, and smoke-tested with both. It converts the README page of
  # this repository inside the container, like docs/defaults does on a developer's machine.
  test-image:
    name: test container image
    needs: [build, test-linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: jetbrains-markdown-cli-linux-*
          path: dist
          merge-multiple: true

      # The build context: the release archives of the two Linux platforms, extracted.
      - name: Extract the archives into the build context
        run: |
          mkdir image-context
          for archive in dist/*.tar.gz; do tar -xzf "$archive" -C image-context; done
          ls image-context/*

      # The default docker driver cannot build for several platforms.
      - uses: docker/setup-buildx-action@v4

      - name: Build with Docker (BuildKit) and with podman and buildah
        run: |
          # Both platforms must resolve; only the amd64 image can be run on this runner.
          docker buildx build --platform linux/amd64,linux/arm64 -f Containerfile image-context
          docker buildx build --platform linux/amd64 --load -t jmc-test:docker -f Containerfile image-context
          podman build --platform linux/amd64 -t jmc-test:podman -f Containerfile image-context
          buildah build --platform linux/arm64 -f Containerfile image-context

      - name: Smoke test
        run: |
          for tool in docker podman; do
            echo "::group::$tool"
            image=jmc-test:$tool
            # Like in the README: as the user of the runner, which podman needs --userns=keep-id for.
            user=(--user "$(id -u):$(id -g)")
            [[ $tool == docker ]] || user=(--userns=keep-id "${user[@]}")
            [[ "$($tool run --rm $image jetbrains-markdown-cli --version)" =~ ^jetbrains-markdown-cli\ [0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$ ]]
            out=$(printf '# Hello\n\nsome *markdown*\n' | $tool run --rm -i $image jetbrains-markdown-cli)
            echo "$out"
            [[ "$out" == *"<h1 id=\"hello\">Hello</h1>"* && "$out" == *"<em>markdown</em>"* ]]
            # GitLab CI runs the script of a job with a shell in the image, and there is no entrypoint to get in its way.
            [[ "$($tool run --rm $image sh -c 'echo shell')" == shell ]]
            [[ "$($tool inspect --format '{{.Config.Entrypoint}}' $image)" == "[]" ]]
            $tool run --rm $image sh -c 'test -s /usr/share/doc/jetbrains-markdown-cli/LICENSE && test -s /usr/share/doc/jetbrains-markdown-cli/THIRD-PARTY'
            # The README page, as docs/defaults builds it, with the project mounted.
            rm -f README.html
            $tool run --rm -v "$PWD:/work" -w /work "${user[@]}" $image jetbrains-markdown-cli -d docs/defaults
            out=$(cat README.html)
            [[ "$out" == "<!DOCTYPE html>"* && "$out" == *"<title>jetbrains-markdown-cli</title>"* ]]
            [[ "$out" == *'id="building-this-page"'* && "$out" == *'<nav id="TOC" role="doc-toc">'* ]]
            # The same for the changelog page, which the release workflow prints to PDF.
            rm -f CHANGELOG.html
            $tool run --rm -v "$PWD:/work" -w /work "${user[@]}" $image jetbrains-markdown-cli -d docs/changelog
            out=$(cat CHANGELOG.html)
            [[ "$out" == *"<title>Changelog</title>"* && "$out" == *'id="toc-'* && "$out" != *"<style> element"* ]]
            echo "::endgroup::"
          done

  # Publishes the image to the GitHub container registry, for the platforms of the Linux binaries. The binaries are the
  # ones that go on the release: the release job (and its CHANGELOG.pdf) comes after this one.
  image:
    name: Publish container image
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, build, test-linux-arm64, test-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # A dispatched run builds the tip of main, which could have moved on since the release PR was merged.
      - name: Check that the binaries are built from the released commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: '[ "$RELEASE_SHA" = "$GITHUB_SHA" ]'

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: jetbrains-markdown-cli-linux-*
          path: dist
          merge-multiple: true

      - name: Extract the archives into the build context
        run: |
          mkdir image-context
          for archive in dist/*.tar.gz; do tar -xzf "$archive" -C image-context; done

      # v1.2.3 is the image 1.2.3, 1.2, 1 and latest, like the major version tag of the action.
      - name: Work out the image tags
        id: tags
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}
          version=${TAG#v}
          {
            echo "tags<<EOF"
            echo "$image:$version"
            echo "$image:${version%.*}"
            echo "$image:${version%%.*}"
            echo "$image:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: image-context
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # Without attestations the image index has just the two platforms.
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}

      # A new package starts private (its visibility cannot be set from a workflow): GitLab CI and everybody else pull the image
      # without logging in, so say so loudly, but do not fail a release over it.
      - name: Check that the image can be pulled without logging in
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          export DOCKER_CONFIG=$(mktemp -d) # no credentials
          if docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" > /dev/null; then
            echo "The image can be pulled anonymously."
          else
            echo "::warning title=The container image is not public::Set the visibility of the package ghcr.io/${GITHUB_REPOSITORY,,} to public (package settings), or nobody can use it without logging in."
          fi

  release:
    name: Release
    if: needs.release-please.outputs.release_created == 'true'
    needs: [release-please, build, test-linux-arm64, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # A dispatched run builds the tip of main, which could have moved on since the release PR was merged.
      - name: Check that the binaries are built from the released commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: '[ "$RELEASE_SHA" = "$GITHUB_SHA" ]'

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach the binaries to the GitHub release
        run: gh release upload "$TAG" dist/* THIRD-PARTY --repo "$GITHUB_REPOSITORY"

      # Moves the major version tag (v1) to this release, so that `uses: ...@v1` gets it. Pushed with GITHUB_TOKEN,
      # it does not start another workflow run.
      - name: Move the major version tag
        run: |
          major=${TAG%%.*}
          git tag --force "$major" HEAD
          git push --force origin "refs/tags/$major"

      # The README of this repository, as HTML and PDF, with the action itself, from the release that was just made.
      # This is also the example of the README: convert with the action, then print the page with Chrome.
      - name: Convert the README to HTML
        uses: ./
        with:
          defaults: docs/defaults
          version: ${{ needs.release-please.outputs.tag_name }}

      # Chrome is on the runner. The page loads highlight.js and Mermaid from a CDN, which the virtual time budget
      # gives time to run before the page is printed.
      - name: Print the HTML to PDF
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=30000 --print-to-pdf=README.pdf "file://$PWD/README.html"
          test -s README.pdf

      - name: Attach the PDF to the GitHub release
        run: gh release upload "$TAG" README.pdf --clobber --repo "$GITHUB_REPOSITORY"

      # The changelog, as HTML and PDF, with the container image that was just published, instead of the action.
      # CHANGELOG.md already has this release, as the release PR was merged. It logs in to pull, so that a package that is
      # not public yet (see the image job) does not fail the release.
      - name: Convert the changelog to HTML with the container image
        run: |
          image=ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker run --rm -v "$PWD:/work" -w /work --user "$(id -u):$(id -g)" "$image" jetbrains-markdown-cli -d docs/changelog
          test -s CHANGELOG.html

      - name: Print the changelog to PDF
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=30000 --print-to-pdf=CHANGELOG.pdf "file://$PWD/CHANGELOG.html"
          test -s CHANGELOG.pdf

      - name: Attach the changelog PDF to the GitHub release
        run: gh release upload "$TAG" CHANGELOG.pdf --clobber --repo "$GITHUB_REPOSITORY"
